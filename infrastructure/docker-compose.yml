services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roxstar
      POSTGRES_PASSWORD: roxstar
      POSTGRES_DB: roxstar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgres://roxstar:roxstar@postgres:5432/roxstar
      PORT: 8080
      CORS_ORIGIN: "*"
      MIGRATIONS_DIR: /database/migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
